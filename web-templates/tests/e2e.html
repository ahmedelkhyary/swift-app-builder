<!doctype html>
<!--
  End-to-end run of every flow of the web prototype, in every template.
  Open in a browser, or headless:
    chrome --headless=new --allow-file-access-from-files --virtual-time-budget=150000 \
      --dump-dom "file:///<repo>/web-templates/tests/e2e.html?templates=simple,luxury"
  The result is in <pre id="log">: one "<template>: all flows OK" line per
  template, or "FAIL: ...", then the list of JS errors (must be []).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RuiApp e2e</title>
  <link rel="stylesheet" href="../recruitment-ui/rui.css">
  <link rel="stylesheet" href="../recruitment-ui/app/app.css">
  <style>#app { width: 390px; height: 840px; }</style>
</head>
<body>
  <div id="app"></div>
  <pre id="log">running…</pre>
  <script>
    window.__errors = [];
    addEventListener("error", (e) => __errors.push(e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno));
    addEventListener("unhandledrejection", (e) => __errors.push("rejection: " + ((e.reason && e.reason.stack) || e.reason)));
  </script>
  <script src="../recruitment-ui/rui-theme.js"></script>
  <script src="../recruitment-ui/app/repository.js"></script>
  <script src="../recruitment-ui/app/session.js"></script>
  <script src="../recruitment-ui/app/core.js"></script>
  <script src="../recruitment-ui/app/screens/auth.js"></script>
  <script src="../recruitment-ui/app/screens/main.js"></script>
  <script src="../recruitment-ui/app/screens/featured.js"></script>
  <script src="../recruitment-ui/app/screens/individuals.js"></script>
  <script src="../recruitment-ui/app/screens/hourly.js"></script>
  <script src="../recruitment-ui/app/screens/mediation.js"></script>
  <script src="../recruitment-ui/app/screens/payment.js"></script>
  <script src="e2e.js"></script>
</body>
</html>
