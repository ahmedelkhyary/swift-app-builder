<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Template Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <link rel="stylesheet" href="../recruitment-ui/rui.css">
  <link rel="stylesheet" href="../recruitment-ui/app/app.css">
  <style>
    /* ===== Wizard page (not themed by the templates) ===================== */
    html, body { height: 100%; }
    body.wz-body {
      margin: 0;
      background: #f3f4f7;
      color: #1a1f2e;
      font: 14px/1.5 "IBM Plex Sans Arabic", system-ui, sans-serif;
    }
    .wz { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; height: 100%; }
    .wz-panel {
      overflow-y: auto;
      background: #fff;
      border-inline-end: 1px solid #e4e7ee;
      padding: 24px 24px 40px;
      display: grid; gap: 22px; align-content: start;
    }
    .wz-panel h1 { margin: 0; font-size: 20px; }
    .wz-panel > p { margin: -14px 0 0; color: #5b6172; }
    .wz-step { display: grid; gap: 12px; }
    .wz-step h2 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; }
    .wz-num {
      display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
      background: #1a1f2e; color: #fff; font-size: 12px; font-weight: 700;
    }

    .wz-templates { display: grid; gap: 8px; }
    .wz-tpl {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      border: 1.5px solid #e4e7ee; border-radius: 12px; cursor: pointer;
      transition: border-color 150ms, background 150ms;
    }
    .wz-tpl:hover { border-color: #c5cad6; }
    .wz-tpl:has(input:checked) { border-color: #1a1f2e; background: #f7f8fb; }
    .wz-tpl:has(input:focus-visible) { outline: 3px solid #9db4ff; outline-offset: 2px; }
    .wz-tpl input { position: absolute; opacity: 0; pointer-events: none; }
    .wz-tpl__text { flex: 1; display: grid; }
    .wz-tpl__text small { color: #5b6172; }
    .wz-swatches { display: flex; }
    .wz-swatches span {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 0 0 1px #e4e7ee; margin-inline-start: -6px;
    }

    .wz-colors { display: grid; gap: 8px; }
    .wz-color { display: flex; align-items: center; gap: 10px; }
    .wz-color span { flex: 1; }
    .wz-color input[type="color"] { width: 36px; height: 32px; padding: 0; border: 1px solid #e4e7ee; border-radius: 8px; background: none; cursor: pointer; }
    .wz-color input[type="text"] {
      width: 96px; padding: 6px 8px; border: 1px solid #e4e7ee; border-radius: 8px;
      font: 13px ui-monospace, monospace; text-transform: uppercase; direction: ltr;
    }
    .wz-color input[aria-invalid="true"] { border-color: #ba1a1a; }

    .wz-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .wz-seg { display: inline-flex; padding: 3px; background: #eef0f4; border-radius: 10px; }
    .wz-seg button {
      border: 0; background: none; padding: 6px 12px; border-radius: 8px;
      font: inherit; font-size: 13px; color: #5b6172; cursor: pointer;
    }
    .wz-seg button[aria-pressed="true"] { background: #fff; color: #1a1f2e; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
    .wz-switch { position: relative; width: 40px; height: 22px; }
    .wz-switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .wz-switch span { position: absolute; inset: 0; border-radius: 11px; background: #cfd3dc; transition: background 150ms; pointer-events: none; }
    .wz-switch span::after {
      content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transition: transform 150ms;
    }
    .wz-switch input:checked + span { background: #1a1f2e; }
    .wz-switch input:checked + span::after { transform: translateX(-18px); }
    [dir="ltr"] .wz-switch input:checked + span::after { transform: translateX(18px); }
    .wz-switch input:focus-visible + span { outline: 3px solid #9db4ff; outline-offset: 2px; }

    .wz-preview {
      position: relative; overflow: hidden;
      display: grid; place-items: center; align-content: center; gap: 14px;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 40%, #fff, #e9ebf0);
    }
    .wz-caption { color: #5b6172; font-size: 13px; }

    /* ===== Phone frame: port of lib/features/builder/presentation/phone_frame.dart
       Body 300x620 + 3px side buttons, 11px bezel; the app is laid out at
       390 logical px and scaled into the 278px-wide screen. --s scales it all. */
    .phone {
      --s: 1;
      --outer: 52px; --screen: 42px;
      position: relative;
      width: calc(306px * var(--s));
      height: calc(620px * var(--s));
      flex: none;
    }
    .phone[data-device="android"] { --outer: 40px; --screen: 30px; }
    .phone__body {
      position: absolute; top: 0; bottom: 0;
      left: calc(3px * var(--s)); right: calc(3px * var(--s));
      padding: calc(11px * var(--s));
      background: #14171d;
      border: calc(1.5px * var(--s)) solid #3a404c;
      border-radius: calc(var(--outer) * var(--s));
      box-shadow: 0 calc(30px * var(--s)) calc(60px * var(--s)) calc(-20px * var(--s)) rgb(20 24 40 / 0.45);
    }
    .phone__screen {
      position: relative; width: 100%; height: 100%;
      overflow: hidden; background: #fff;
      border-radius: calc(var(--screen) * var(--s));
      /* Keeps sticky / fixed children inside the screen. */
      transform: translateZ(0);
    }
    .phone__screen > .rui-app {
      position: absolute; top: 0; left: 0;
      width: 390px;
      height: calc(390px * 598 / 278);
      transform-origin: 0 0;
      transform: scale(calc(278 * var(--s) / 390));
    }
    .phone__btn { position: absolute; width: calc(3px * var(--s)); border-radius: 2px; background: #2a2f3a; }
    .phone__island, .phone__home { position: absolute; left: 50%; transform: translateX(-50%); background: #000; z-index: 2; pointer-events: none; }
    .phone__island { top: calc(21px * var(--s)); width: calc(92px * var(--s)); height: calc(26px * var(--s)); border-radius: calc(13px * var(--s)); }
    .phone[data-device="android"] .phone__island { top: calc(23px * var(--s)); width: calc(12px * var(--s)); height: calc(12px * var(--s)); border-radius: 50%; }
    .phone__home { bottom: calc(18px * var(--s)); width: calc(108px * var(--s)); height: calc(4px * var(--s)); border-radius: 2px; background: #1a1f2e; }
    .phone[data-dark="true"] .phone__home { background: rgb(255 255 255 / 0.85); }
    .phone[data-device="android"] .phone__home,
    .phone[data-device="android"] .phone__btn--iphone,
    .phone[data-device="iphone"] .phone__btn--android { display: none; }

    /* ===== The app inside the phone ===================================== */
    .rui-app {
      --rui-safe-top: 64px;    /* 46 frame px -> logical (PhoneFrame.topInsetFor) */
      --rui-safe-bottom: 20px;
    }
    .phone[data-device="android"] .rui-app { --rui-safe-top: 48px; --rui-safe-bottom: 8px; }

    .wz-jump { display: flex; flex-wrap: wrap; gap: 6px; }
    .wz-jump button {
      border: 1px solid #e4e7ee; background: #fff; border-radius: 999px; padding: 6px 12px;
      font: inherit; font-size: 13px; color: #1a1f2e; cursor: pointer;
    }
    .wz-jump button:hover { border-color: #c5cad6; background: #f7f8fb; }
    .wz-jump button.is-reset { color: #ba1a1a; }

    /* ===== Narrow screens: panel on top, phone below ======================= */
    @media (max-width: 900px) {
      .wz { grid-template-columns: 1fr; height: auto; }
      .wz-panel { border-inline-end: 0; border-bottom: 1px solid #e4e7ee; padding: 20px 16px; }
      .wz-preview { min-height: 0; padding: 24px 16px 40px; }
    }
  </style>
</head>
<body class="wz-body">
  <div class="wz">
    <aside class="wz-panel">
      <h1>معاينة القوالب</h1>
      <p>اختر القالب والألوان، والمعاينة على الموبايل تتحدّث فورًا.</p>

      <section class="wz-step" aria-labelledby="step1">
        <h2 id="step1"><span class="wz-num">1</span> القالب</h2>
        <div class="wz-templates" id="templates" role="radiogroup" aria-labelledby="step1"></div>
      </section>

      <section class="wz-step" aria-labelledby="step2">
        <h2 id="step2"><span class="wz-num">2</span> الهوية البصرية</h2>
        <div class="wz-colors">
          <label class="wz-color"><span>اللون الأساسي</span><input type="text" data-hex="primary" maxlength="7"><input type="color" id="primary" value="#1b4d89" aria-label="اللون الأساسي"></label>
          <label class="wz-color"><span>اللون الثانوي</span><input type="text" data-hex="secondary" maxlength="7"><input type="color" id="secondary" value="#f2a541" aria-label="اللون الثانوي"></label>
          <label class="wz-color"><span>لون التمييز (الروابط)</span><input type="text" data-hex="accent" maxlength="7"><input type="color" id="accent" value="#2e9e5b" aria-label="لون التمييز"></label>
        </div>
      </section>

      <section class="wz-step" aria-labelledby="step3">
        <h2 id="step3"><span class="wz-num">3</span> العرض</h2>
        <div class="wz-row"><span>الوضع الداكن</span><label class="wz-switch"><input type="checkbox" id="dark" aria-label="الوضع الداكن"><span></span></label></div>
        <div class="wz-row"><span>لغة التطبيق</span>
          <div class="wz-seg" data-group="lang"><button type="button" data-value="ar" aria-pressed="true">العربية</button><button type="button" data-value="en" aria-pressed="false">English</button></div>
        </div>
        <div class="wz-row"><span>الجهاز</span>
          <div class="wz-seg" data-group="device"><button type="button" data-value="iphone" aria-pressed="true">iPhone</button><button type="button" data-value="android" aria-pressed="false">Android</button></div>
        </div>
      </section>

      <section class="wz-step" aria-labelledby="step4">
        <h2 id="step4"><span class="wz-num">4</span> التنقل السريع</h2>
        <div class="wz-jump" id="jump">
          <button type="button" data-entry="login">تسجيل الدخول</button>
          <button type="button" data-entry="home">الرئيسية</button>
          <button type="button" data-entry="individuals">الأفراد</button>
          <button type="button" data-entry="hourly">بالساعة</button>
          <button type="button" data-entry="mediation">الوساطة</button>
          <button type="button" data-entry="reset" class="is-reset">إعادة ضبط</button>
        </div>
      </section>
    </aside>

    <section class="wz-preview" id="preview" aria-label="معاينة التطبيق">
      <div class="phone" id="phone" data-device="iphone">
        <span class="phone__btn phone__btn--iphone" style="left:0;top:calc(92px*var(--s));height:calc(22px*var(--s))"></span>
        <span class="phone__btn phone__btn--iphone" style="left:0;top:calc(134px*var(--s));height:calc(42px*var(--s))"></span>
        <span class="phone__btn phone__btn--iphone" style="left:0;top:calc(186px*var(--s));height:calc(42px*var(--s))"></span>
        <span class="phone__btn phone__btn--iphone" style="right:0;top:calc(152px*var(--s));height:calc(72px*var(--s))"></span>
        <span class="phone__btn phone__btn--android" style="right:0;top:calc(150px*var(--s));height:calc(58px*var(--s))"></span>
        <span class="phone__btn phone__btn--android" style="right:0;top:calc(222px*var(--s));height:calc(78px*var(--s))"></span>
        <div class="phone__body">
          <div class="phone__screen">
            <div class="rui-app" id="app"></div>
          </div>
        </div>
        <span class="phone__island"></span>
        <span class="phone__home"></span>
      </div>
      <div class="wz-caption" id="caption"></div>
    </section>
  </div>

  <script src="../recruitment-ui/rui-theme.js"></script>
  <script src="../recruitment-ui/app/repository.js"></script>
  <script src="../recruitment-ui/app/session.js"></script>
  <script src="../recruitment-ui/app/core.js"></script>
  <script src="../recruitment-ui/app/screens/auth.js"></script>
  <script src="../recruitment-ui/app/screens/main.js"></script>
  <script src="../recruitment-ui/app/screens/featured.js"></script>
  <script src="../recruitment-ui/app/screens/individuals.js"></script>
  <script src="../recruitment-ui/app/screens/hourly.js"></script>
  <script src="../recruitment-ui/app/screens/mediation.js"></script>
  <script src="../recruitment-ui/app/screens/payment.js"></script>
  <script>
    "use strict";
    const DESCRIPTIONS = {
      simple: "صفحات بيضاء وهيدر بلون البراند",
      luxury: "حبر داكن وذهبي وخطوط serif",
      premium: "زجاج وتدرجات وحركة غنية",
    };

    const $ = (id) => document.getElementById(id);
    const phone = $("phone");
    const state = { template: "premium", lang: "ar", device: "iphone" };
    let app = null; // RuiApp controller

    // ---- Step 1: template cards (swatches follow the brand colors) ----------
    function buildTemplateCards() {
      $("templates").replaceChildren(...Object.values(RuiTheme.TEMPLATES).map((t) => {
        const label = document.createElement("label");
        label.className = "wz-tpl";
        label.innerHTML =
          `<input type="radio" name="template" value="${t.id}">` +
          `<span class="wz-tpl__text"><strong>${t.nameAr}</strong><small>${DESCRIPTIONS[t.id]}</small></span>` +
          `<span class="wz-swatches" aria-hidden="true"><span></span><span></span><span></span></span>`;
        const input = label.querySelector("input");
        input.checked = t.id === state.template;
        input.addEventListener("change", () => { state.template = t.id; applyTheme(); });
        return label;
      }));
    }

    function updateSwatches(branding, dark) {
      const b = RuiTheme.parseBranding(branding);
      document.querySelectorAll(".wz-tpl").forEach((label) => {
        const t = RuiTheme.TEMPLATES[label.querySelector("input").value];
        const k = RuiTheme.resolveTokens(t, b, dark);
        const [a, c, p] = label.querySelectorAll(".wz-swatches span");
        a.style.background = RuiTheme.color.css(k.chrome);
        c.style.background = RuiTheme.color.css(k.accent);
        p.style.background = RuiTheme.color.css({ ...k.page, a: 1 });
      });
    }

    // ---- Theme: re-themes the running app, its state is kept ------------------
    function branding() {
      return {
        primaryColor: $("primary").value,
        secondaryColor: $("secondary").value,
        accentColor: $("accent").value,
        fontFamily: "Cairo",
        appNameAr: "مكتب الاستقدام",
        appNameEn: "Recruitment Office",
      };
    }

    function applyTheme() {
      const dark = $("dark").checked;
      const opts = { templateId: state.template, branding: branding(), dark, lang: state.lang };
      if (app) app.update(opts);
      else app = RuiApp.mount($("app"), opts);
      const t = RuiTheme.TEMPLATES[state.template];
      phone.dataset.dark = String(dark);
      phone.dataset.device = state.device;
      $("caption").textContent = `${t.nameAr} · ${t.nameEn} — v${RuiTheme.TEMPLATE_VERSION}`;
      updateSwatches(branding(), dark);
    }

    // ---- Phone size: fits the preview area, like PhoneFrame's scale ------------
    function fitPhone() {
      const area = $("preview");
      const wide = matchMedia("(min-width: 901px)").matches;
      const maxH = wide ? area.clientHeight - 80 : 700;
      const s = Math.max(0.5, Math.min(1.3, maxH / 620, (area.clientWidth - 32) / 306));
      phone.style.setProperty("--s", s.toFixed(3));
    }

    // ---- Controls ----------------------------------------------------------------
    ["primary", "secondary", "accent"].forEach((id) => {
      const picker = $(id);
      const text = document.querySelector(`[data-hex="${id}"]`);
      text.value = picker.value.toUpperCase();
      picker.addEventListener("input", () => { text.value = picker.value.toUpperCase(); text.removeAttribute("aria-invalid"); applyTheme(); });
      text.addEventListener("input", () => {
        const v = text.value.trim().replace(/^#?/, "#");
        const ok = /^#[0-9a-fA-F]{6}$/.test(v);
        text.setAttribute("aria-invalid", String(!ok));
        if (ok) { picker.value = v.toLowerCase(); applyTheme(); }
      });
    });
    $("dark").addEventListener("change", applyTheme);
    document.querySelectorAll(".wz-seg").forEach((seg) => seg.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      state[seg.dataset.group] = btn.dataset.value;
      applyTheme();
    }));
    $("jump").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || !app) return;
      if (btn.dataset.entry === "reset") app.session.reset();
      else app.session.jumpTo(btn.dataset.entry);
    });
    addEventListener("resize", fitPhone);

    // Deep links: ?template=luxury&dark=1&lang=en&device=android&entry=hourly
    const params = new URLSearchParams(location.search);
    if (RuiTheme.TEMPLATES[params.get("template")]) state.template = params.get("template");
    if (params.get("dark") === "1") $("dark").checked = true;
    if (params.get("lang") === "en") state.lang = "en";
    if (params.get("device") === "android") state.device = "android";
    document.querySelectorAll(".wz-seg").forEach((seg) => seg.querySelectorAll("button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.value === state[seg.dataset.group]))));

    buildTemplateCards();
    fitPhone();
    applyTheme();
    if (params.get("entry")) app.session.jumpTo(params.get("entry"));
  </script>
</body>
</html>
